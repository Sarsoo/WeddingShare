name: ci

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    name: Build & Unit Test
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ '9.0.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3.0.3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Install Dependencies
        run: dotnet restore WeddingShare.sln
      - name: Build
        run: dotnet build --configuration Debug --no-restore WeddingShare.sln
      - name: Test
        run: dotnet test --no-restore --verbosity normal WeddingShare.sln

  build-Docker:

    runs-on: ubuntu-latest
    name: Build Containers
    needs: [build] # for ignoring bad builds
    if: github.event_name == 'push' && (github.ref == 'refs/heads/sarsoo/dev' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Web Container
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: sarsoo/weddingshare:latest
          file: WeddingShare/Dockerfile
          no-cache: true
          platforms: linux/amd64,linux/arm64
