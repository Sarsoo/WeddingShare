name: ci

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    name: Build & Unit Test
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ '9.0.x' ]

    steps:
      - uses: actions/checkout@v4
        with:
          github-server-url: https://gitea.sheep-ghoul.ts.net
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3.0.3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Install Dependencies
        run: dotnet restore WeddingShare.sln
      - name: Build
        run: dotnet build --configuration Debug --no-restore WeddingShare.sln
      - name: Test
        run: dotnet test --no-restore --verbosity normal WeddingShare.sln

  build-Docker:

    runs-on: ubuntu-latest
    name: Build Containers
    needs: [build] # for ignoring bad builds
    if: gitea.event_name == 'push' && (gitea.ref == 'refs/heads/sarsoo/dev' || startsWith(gitea.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@v4
        with:
          github-server-url: https://gitea.sheep-ghoul.ts.net

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: gitea.sheep-ghoul.ts.net
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Web Container
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: gitea.sheep-ghoul.ts.net/sarsoo/selector-web:latest
          file: WeddingShare/Dockerfile
          context: .
